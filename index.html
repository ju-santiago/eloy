<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eloy | Gestão simplificada</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">

        <img src="assets/logo-eloy.png" alt="Logo da Eloy">
        <h1>Eloy</h1>
        <p>Sua empresa organizada. Sua rotina mais leve.</p>

        </div>
    </header>

    <nav>
        <a href="index.html" class="ativo">Início</a>
        <a href="vendas.html">Vendas</a>
        <a href="despesas.html">Despesas</a>
        <a href="produtos.html">Produtos</a>
        <a href="clientes.html">Clientes</a>
    </nav>

        <!--nav serve para criar um menu de navegação entre os links-->

    <main>

        <section>
            <h2>Bem-vinda, empreendedora!</h2>
            <p>Pronta para otimizar os resultados da sua empresa?</p>

        <section class="resumo">

            <div class="card">

                <p id="vendas-hoje">R$ 0,00</p>

            <div class="card">

            </div>

            <div class="card">
                <h3>Despesas de hoje</h3>
                <p id="despesas-hoje">R$ 0,00</p>
            </div>

            <div class="card">
                <h3>Lucro estimado</h3>

            </div>
